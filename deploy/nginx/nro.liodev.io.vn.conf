server {
    server_name nro.liodev.io.vn;

    root /var/www/WebLio;
    index index.php;
    charset utf-8;
    client_max_body_size 128m;

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location /phpmyadmin/ {
        alias /usr/share/phpmyadmin/;
        index index.php;
    }

    location ~ ^/phpmyadmin/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/$1;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location ~ ^/phpmyadmin/(doc|sql|setup)/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri.php?$query_string;
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location ~ ^/(database|deploy)/ {
        deny all;
    }

    location ~* \.(sql|log|md|bat)$ {
        deny all;
    }

    # Static and upload directories must never execute PHP, even if a PHP file
    # is accidentally committed or uploaded there.
    location ~ ^/(assets|images|view)/.*\.php$ {
        deny all;
    }

    # These files are application includes, not public endpoints.
    location ~ ^/(server_config|cauhinh|config|connect|settings|task_data_config|forum_data|post_detail_logic|set|recharge_bonus|lucky_rewards)\.php$ {
        deny all;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nro.liodev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nro.liodev.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name nro.liodev.io.vn;
    return 301 https://$host$request_uri;
}
